name: CI

# Typecheck, test, and prove the committed reference and example renders are
# what the code generates: a change under examples/renders/ or in
# docs/reference.md must come from a change in the code, committed together.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs
      - run: npm run examples
      - name: generated files are up to date
        run: git diff --exit-code --stat -- docs/reference.md examples/renders/
