name: CI

# Typecheck, test, and prove the committed generated files (the reference,
# the gallery, the example, dogfood and library renders) are what the code generates:
# a change to any of them must come from a change in the code or a program,
# committed together.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs
      - run: npm run examples
      - run: npm run dogfood
      - run: npm run std
      - run: npm run pages:gallery
      - name: generated files are up to date
        run: git diff --exit-code --stat -- docs/reference.md docs/gallery.md examples/renders/ dogfood/renders/ std/renders/
